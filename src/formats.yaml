# Tangerine Linux Format Mappings
# input_mime -> output_mime -> pipeline

formats:
  # Images
  - input_mime: "image/heic"
    output_mime: "image/jpeg"
    pipeline: "heic-to-jpeg"
    description: "HEIC to JPEG"
  - input_mime: "image/heic"
    output_mime: "image/png"
    pipeline: "heic-to-png"
    description: "HEIC to PNG"
  - input_mime: "image/avif"
    output_mime: "image/jpeg"
    pipeline: "avif-to-jpeg"
    description: "AVIF to JPEG"
  - input_mime: "image/avif"
    output_mime: "image/png"
    pipeline: "avif-to-png"
    description: "AVIF to PNG"
  - input_mime: "image/jpeg"
    output_mime: "image/png"
    pipeline: "jpeg-to-png"
    description: "JPEG to PNG"
  - input_mime: "image/jpeg"
    output_mime: "image/webp"
    pipeline: "jpeg-to-webp"
    description: "JPEG to WebP"
  - input_mime: "image/png"
    output_mime: "image/jpeg"
    pipeline: "png-to-jpeg"
    description: "PNG to JPEG"
  - input_mime: "image/png"
    output_mime: "image/webp"
    pipeline: "png-to-webp"
    description: "PNG to WebP"
  - input_mime: "image/webp"
    output_mime: "image/png"
    pipeline: "webp-to-png"
    description: "WebP to PNG"
  - input_mime: "image/webp"
    output_mime: "image/jpeg"
    pipeline: "webp-to-jpeg"
    description: "WebP to JPEG"

  # Video
  - input_mime: "video/mp4"
    output_mime: "video/x-matroska"
    pipeline: "mp4-to-mkv"
    description: "MP4 to MKV"
  - input_mime: "video/x-matroska"
    output_mime: "video/mp4"
    pipeline: "mkv-to-mp4"
    description: "MKV to MP4"
  - input_mime: "video/mp4"
    output_mime: "audio/mpeg"
    pipeline: "video-extract-audio-mp3"
    description: "Extract MP3 from MP4"
  - input_mime: "video/x-matroska"
    output_mime: "audio/mpeg"
    pipeline: "video-extract-audio-mp3"
    description: "Extract MP3 from MKV"
  - input_mime: "video/mp4"
    output_mime: "image/gif"
    pipeline: "video-to-gif"
    description: "Video to GIF"

  # Audio
  - input_mime: "audio/mpeg"
    output_mime: "audio/flac"
    pipeline: "mp3-to-flac"
    description: "MP3 to FLAC"
  - input_mime: "audio/flac"
    output_mime: "audio/mpeg"
    pipeline: "flac-to-mp3"
    description: "FLAC to MP3"
  - input_mime: "audio/wav"
    output_mime: "audio/mpeg"
    pipeline: "wav-to-mp3"
    description: "WAV to MP3"
  - input_mime: "audio/opus"
    output_mime: "audio/mpeg"
    pipeline: "opus-to-mp3"
    description: "Opus to MP3"

  # PDF
  - input_mime: "application/pdf"
    output_mime: "image/png"
    pipeline: "pdf-to-png"
    description: "PDF to PNG (300 DPI)"
  - input_mime: "application/pdf"
    output_mime: "image/jpeg"
    pipeline: "pdf-to-jpeg"
    description: "PDF to JPEG (300 DPI)"
  - input_mime: "application/pdf"
    output_mime: "text/plain"
    pipeline: "pdf-to-text"
    description: "PDF to Text"
  - input_mime: "application/pdf"
    output_mime: "text/markdown"
    pipeline: "pdf-to-md"
    description: "PDF to Markdown"

  # Documents
  - input_mime: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    output_mime: "application/pdf"
    pipeline: "docx-to-pdf"
    description: "DOCX to PDF"
  - input_mime: "application/vnd.oasis.opendocument.text"
    output_mime: "application/pdf"
    pipeline: "odt-to-pdf"
    description: "ODT to PDF"

  # Archives
  - input_mime: "application/zip"
    output_mime: "application/x-tar"
    pipeline: "zip-to-tar"
    description: "ZIP to TAR"
  - input_mime: "application/x-tar"
    output_mime: "application/gzip"
    pipeline: "tar-to-gzip"
    description: "TAR to TAR.GZ"